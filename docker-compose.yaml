x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  litellm-postgres:
    image: postgres:16-alpine
    container_name: litellm-postgres
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:-litellm}
    volumes:
      - litellm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 512M
    networks:
      - litellm-internal

  litellm-redis:
    image: redis:7-alpine
    container_name: litellm-redis
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - apparmor:unconfined
    command: >
      redis-server
      --appendonly yes
      --requirepass ${LITELLM_REDIS_PASSWORD:-litellm}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - litellm-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LITELLM_REDIS_PASSWORD:-litellm}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
    networks:
      - litellm-internal

  litellm:
    image: litellm-opencode:latest
    build:
      context: .
      dockerfile: Dockerfile.custom
      args:
        REPO_URL: "https://github.com/tobias-weiss-ai-xr/litellm.git"
        BRANCH: "ce-size-limiting"
    container_name: litellm-proxy
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    depends_on:
      litellm-postgres:
        condition: service_healthy
      litellm-redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "0.0.0.0:4000:4000"
    environment:
      ZAI_API_KEY: "${ZAI_API_KEY}"
      SAIA_API_KEY: "${SAIA_API_KEY}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY}"
      GROQ_API_KEY: "${GROQ_API_KEY}"
      GROQ_API_KEY_FALLBACK: "${GROQ_API_KEY_FALLBACK}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      OPENCODE_GO_API_KEY: "${OPENCODE_GO_API_KEY}"
      TUD_API_KEY: "${TUD_API_KEY}"
      LITELLM_LOG: "INFO"
      LITELLM_NUM_WORKERS: "2"
      JSON_LOGS: "true"
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:-litellm}@litellm-postgres:5432/litellm
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - litellm-logs:/app/logs
    command: --config /app/config.yaml --port 4000 --host 0.0.0.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
    networks:
      - default
      - litellm-internal

networks:
  default:
    driver: bridge
  litellm-internal:
    driver: bridge

volumes:
  litellm-logs:
  litellm-pgdata:
  litellm-redisdata:
