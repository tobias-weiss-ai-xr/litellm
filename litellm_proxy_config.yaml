      model: openai/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
      api_base: http://192.168.0.149:8080/v1
      api_key: none
      timeout: 120
      stream_timeout: 60

router_settings:
  num_retries: 3
  allowed_fails: 3
  cooldown_time: 30
  fallbacks:
    - high:
        - saia/llama-3.3-70b-instruct
        - opencode-go/deepseek-v4-pro
    - mid:
        - saia/qwen3.5-27b
        - opencode-go/glm-5.1
    - low:
        - saia/llama-3.1-8b-instruct
        - opencode-go/glm-5
